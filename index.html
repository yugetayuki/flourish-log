<!-- 送信先を1種類に絞ってブラウザ側にも宣言する。
     connect-src は *.ts.net だけ。ここはオーナー自身のPCへ写しを送るための Tailscale の
     ドメインで、通常は tailnet に参加している端末からしか到達できない
     (Funnel を有効にしたホストは例外。詳しくは CLAUDE.md の脅威モデル)。
     具体的なホスト名を書かないのは、このリポジトリが Public だから。ワイルドカードでも
     許されるのは Tailscale 内部のホストだけなので、持ち出し先としては使えない。
     インラインの script/style は本アプリの本体なので 'unsafe-inline' は外せない。
     worker-src 'self' は Service Worker の登録に要る。既定では default-src 'none' まで
     フォールバックして登録が弾かれる。同一オリジンのファイルしか読めないので範囲は広がらない。
     frame-ancestors は meta 経由では無視される仕様のため、ここには書いていない。 -->

<style>
:root{
  --bg:#F6F7F3; --card:#FFFFFF; --ink:#232B22; --sub:#71806F; --line:#E3E7DE;
  --dim:#C3CCC0; --pine:#3E6B4F; --pinesoft:#E7F0E8; --indigo:#43507A;
  --indigosoft:#E9ECF5; --sienna:#A9663B; --siennasoft:#F4EAE0; --navbg:#FBFCF9;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
#wrap{max-width:448px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.title{display:flex;align-items:baseline;gap:8px}
/* ラテン文字のワードマークなので、和文名だった頃(.04em)より字間を開けて落ち着かせる */
h1{font-size:18px;font-weight:600;letter-spacing:.10em;margin:0}
.eyebrow{font-size:9px;letter-spacing:2px;color:var(--dim)}
#saveState{font-size:12px;color:var(--sub)}
.banner{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:12px;line-height:1.6}
.banner.err{background:var(--siennasoft);color:var(--sienna)}
.banner.info{background:var(--indigosoft);color:var(--indigo)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px 4px;margin-bottom:12px}
.card>.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ctitle{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--sub)}
.cright{font-size:11px;color:var(--sub)}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.lbl{font-size:14px;font-weight:600}
.sub{font-size:11px;color:var(--sub)}
.seg{display:grid;gap:4px}
.sb{padding:9px 2px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  font-size:12px;font-weight:500;text-align:center;transition:background .12s}
.sb.on{color:#fff;border-color:transparent}
.on-pine{background:var(--pine)} .on-indigo{background:var(--indigo)}
.on-sienna{background:var(--sienna)} .on-gray{background:#8A9388}
.wv{margin-top:8px;width:100%;border:1px solid var(--line);background:var(--bg);
  border-radius:10px;padding:8px 12px;font-size:14px}
/* box-sizing を指定しないと padding のぶん width:100% が親からはみ出す(input と違い textarea は
   既定で content-box のまま効いてしまう)。resize:vertical は横に伸ばしてカードを壊させないため */
.memo{box-sizing:border-box;resize:vertical;font-family:inherit;line-height:1.6}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.navbtn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:15px}
.navbtn:disabled{color:var(--dim)}
.datec{text-align:center}
.dateT{font-size:16px;font-weight:700}
.dateS{font-size:12px;color:var(--sub)}
.hintbtn{width:100%;padding:9px;border:1px solid var(--line);border-radius:12px;
  background:var(--indigosoft);color:var(--indigo);font-size:13px;font-weight:500;margin-bottom:12px}
.foot{font-size:11px;color:var(--sub);padding:0 4px 8px;line-height:1.6}
.wrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.wname{display:flex;align-items:baseline;gap:8px;min-width:0}
.wl{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc{font-size:12px}
.dots{display:flex;gap:4px}
.dot{width:14px;height:14px;border-radius:7px;display:inline-block}
.dot.ok{background:var(--pine)} .dot.ng{background:var(--dim)}
.dot.miss{border:1.5px solid var(--dim);background:transparent}
.dot.fut{background:var(--bg)}
.dhead{display:flex;justify-content:flex-end;gap:4px;margin:4px 0 2px}
.dh{width:14px;text-align:center;font-size:9px;color:var(--sub)}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);margin:6px 0 2px}
.mh{font-size:9px;color:var(--sub);text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px 0}
.mcell{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:30px}
.mday{font-size:9px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.chip{border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:12px;background:var(--bg);color:var(--sub)}
.chip.hit{background:var(--pinesoft);color:var(--pine)}
.bigbtn{width:100%;padding:12px;border-radius:12px;background:var(--pine);color:#fff;
  font-size:14px;font-weight:600;margin-bottom:8px}
.ghost{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);font-size:13px;font-weight:500}
.half{display:flex;gap:8px;padding:8px 0}
.half>*{flex:1}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;
  padding:8px;font-size:11px;line-height:1.5}
.stp{display:flex;align-items:center;gap:8px}
.stpb{width:32px;height:32px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  font-size:16px;font-weight:700}
.stpv{width:34px;text-align:center;font-size:13px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--dim);position:relative;transition:background .15s;flex:none}
.sw.on{background:var(--pine)}
.knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .15s}
.sw.on .knob{left:21px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:13px}
/* 記録タブの分入力。font-size は 16px 未満だと iOS が focus 時に画面をズームする */
.msel{width:100%;padding:10px 12px;font-size:16px}
.addrow{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.addrow input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:13px}
.addbtn{padding:0 14px;border-radius:10px;background:var(--pine);color:#fff;font-size:13px;font-weight:500}
.delbtn{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--sienna);font-size:12px}
.danger{color:var(--sienna);background:var(--siennasoft);border:1px solid var(--line);
  padding:8px 12px;border-radius:10px;font-size:13px;font-weight:500}
.danger.armed{background:var(--sienna);color:#fff;font-weight:700}
.note{font-size:11px;margin:4px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:448px;margin:0 auto;display:flex}
.tb{flex:1;padding:10px 0 12px;text-align:center;font-size:12px;color:var(--sub);position:relative}
.tb.on{color:var(--pine);font-weight:700}
.tb.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--pine);border-radius:1px}
.chartbox{padding:6px 0 10px}
svg{display:block}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="title"><h1>Aubade</h1><span class="eyebrow mono">DAWN&nbsp;LOG&nbsp;·&nbsp;v4.18</span></div>
    <span id="saveState"></span>
  </header>
  <div id="banner"></div>
  <div id="view"></div>
</div>
<nav><div class="navin" id="nav"></div></nav>

<script>
"use strict";
/* ================= 定数 ================= */
var KEY = "flourish-log-v2";
var BROKEN_PREFIX = KEY + "-broken-";
// 就寝・起床・YouTube は選択肢のインデックスではなく実値(分)を保存する(v9)。
// 選択肢のリストは画面の都合にすぎず、刻みを変えても過去の記録の意味は動かない。
// 実値化の対象は物理量だけ。主観尺度(眠れた感・気分)と steps はインデックス保存のままで、
// そちらは従来どおり刻みを変えない(主観に外部の実値は存在せず、細分化は疑似精度を生むだけ)
function minRange(from, to, step){
  var a = []; for (var v = from; v <= to; v += step) a.push(v);
  return a;
}
var BEDTIME_MIN = minRange(1320, 1560, 15); // 22:00〜26:00
var WAKE_MIN    = minRange(300, 600, 15);   // 5:00〜10:00
var YT_MIN      = minRange(0, 480, 30);     // 0〜8h
// 水分は ml の実値。上限は 4L まで取ってある — 天井に張り付くと実際の量が記録から消えるため
// (就寝の「24:30以降」と YouTube の「2h超」で実際に起きた)
var WATER_ML    = minRange(0, 4000, 500);
// 業務時間は分の実値。0 は休みの日で、これが入ることで平日/休日が曜日に頼らず読める
var WORK_MIN    = minRange(0, 840, 30);     // 0〜14h
// 仕事の重さは主観なので計測のみ(設計制約6)。眠れた感・気分と同じ扱い
// 「なし」は尺度の点ではなく「その日は仕事をしていない」。先頭に置いたのは並びが自然になるため
// (末尾だと 軽い/普通/重い/なし となり、重いより右に無関係な段が来る)。
// 先頭に足すと既存の値の意味がずれるので、schema 17 の migrate で +1 して読み替えている
var LOAD_OPTS   = ["なし","軽い","普通","重い"];
var STUDY_MIN   = minRange(0, 240, 15);     // 0〜4h
// 瞑想は5〜30分が実勢なので勉強(15分刻み)では粗すぎる。刻みを細かくしてよいのは物理量だけで、
// 主観尺度(眠れた感・気分)の段数は変えない — 主観に外部の実値は無く、疑似精度だけが増えるため
var MEDITATION_MIN = minRange(0, 120, 5);   // 0〜2h
// ミニ昼寝の実勢は5〜20分だが、上を2hまで取るのは寝落ちした日が天井に張り付くと実際の長さが
// 記録から消えるため(就寝の「24:30以降」と YouTube の「2h超」で実際に起きた。WATER_ML と同じ理屈)。
// 瞑想と刻み・範囲が同じでも定数を分けてあるのは、両者が独立に動きうるため
var NAP_MIN     = minRange(0, 120, 5);      // 0〜2h
// 24時を超えた就寝は 25:12 のように繰り上がりのまま出す(日をまたいだことが読めるように)
function fmtHM(v){ return Math.floor(v/60) + ":" + pad(v%60); }
// YouTube は時刻ではなく時間量なので時計表記にしない。推移タブの左余白(44px)に収まる短さも要件
function fmtDur(v){ return v < 60 ? v + "分" : (v % 60 === 0 ? (v/60) + "h" : (v/60).toFixed(1) + "h"); }
function fmtMl(v){ return v < 1000 ? v + "ml" : (v % 1000 === 0 ? (v/1000) + "L" : (v/1000).toFixed(1) + "L"); }
// 達成ラインを持たない項目なので、週タブでは達成色/注意色ではなく indigo の濃淡で早い→遅いを示す。
// 分値は連続なので添字ではなく式で出す(選択肢の端から導出。移行で入った格子外の値も clamp で収まる)
function wakeOpacity(v){
  var lo = WAKE_MIN[0], hi = WAKE_MIN[WAKE_MIN.length-1];
  return .4 + .6 * Math.min(1, Math.max(0, (v - lo) / (hi - lo)));
}
var SLEEP_OPTS   = ["良","普通","悪"];
// 気分は主観状態で直接コントロールできないので、眠れた感と同じく計測のみ(設計制約6)
var MOOD_OPTS    = ["高","中","低"];
// 誰と過ごしたか。幸福への寄与が大きい変数だが、どの相手が「良い」わけでもないので順序を持たない。
// 相手の名前も人数も持たない(分類のままの方が気分との突き合わせに使える。名前は集計できない)。
// インデックスで保存するので、後から選択肢の順番や意味を変えないこと(過去の記録の意味が黙って変わる)
var COMPANION_OPTS = ["ひとり","家族","友人","仕事"];
// 推移タブのY軸目盛りにも使い回すので、左余白(44px)に収まる短さにしてある
// 歩数も実値へ移した(v16)。選択肢は画面の都合にすぎず、刻みを変えても過去の記録の意味は動かない
var STEPS_N     = minRange(0, 20000, 1000);
// 推移タブのY軸目盛りにも使い回すので、左余白(44px)に収まる短さが要件
function fmtSteps(v){ return v + "歩"; }
// 最上段は上限ではなく「これ以上」。天井に張り付いた記録が「ちょうど20000歩」に見えないようにする
function fmtStepsOpt(v){ return v === STEPS_N[STEPS_N.length-1] ? v + "歩以上" : fmtSteps(v); }
// 食べた/飲んだその場で1タップする項目。3回ぶんは entries に個別に持ち、達成は日単位へ畳む。
// 週タブと目標では1行に見せる(3行に増やすと1日あたりの未達の面積が3倍になるため)
var PERDAY = [
  {id:"meal", label:"食事の節制", card:"食事",
   parts:[{id:"mealB", label:"朝食"},{id:"mealL", label:"昼食"},{id:"mealD", label:"夕食"}],
   btn:{t:"✓ 節制した", f:"✗ しなかった"},
   note:"ジャンクフードと飲み会がなければ「節制した」。食べるたびに1タップで、"
      + "記録した食事がすべて節制ならその日は達成です(記録しなかった食事は数えません)。"},
  {id:"supp", label:"整腸剤・サプリ", card:"サプリ",
   parts:[{id:"suppM", label:"朝サプリ"},{id:"suppN", label:"昼サプリ"},{id:"suppE", label:"晩サプリ"}],
   btn:{t:"✓ 飲んだ", f:"✗ 飲まなかった"},
   note:"クレアチンとアシュワガンダは別項目なので、ここには含めません。飲むたびに1タップで、"
      + "記録した回がすべて「飲んだ」ならその日は達成です(記録しなかった回は数えません)。"},
];
function perDay(id){
  for (var i=0;i<PERDAY.length;i++) if (PERDAY[i].id === id) return PERDAY[i];
  return null;
}
function perDayParts(){
  return PERDAY.reduce(function(a, g){ return a.concat(g.parts); }, []);
}
// 1日3回その場でタップする点は PERDAY と同じだが、達成判定を持たない点が違う。
// PERDAY に入れると畳んだ達成・週目標・週タブの未達行が自動で付いてくるので、別に持つ。
// 指す時点は PERDAY と同じく当日(記録した朝ではない)
var MOOD = {id:"mood", label:"今の気分", card:"気分",
  parts:[{id:"moodM", label:"朝"},{id:"moodN", label:"昼"},{id:"moodE", label:"晩"}],

}
function buildCSV(data){
  var cols=["date","就寝時刻(分)","起床時刻(分)","眠れた感","YouTube(分)","アシュワガンダ","朝コーヒー","クレアチン","体重測定","体重","ジム","勉強(旧・真偽)","勉強(分)","瞑想(分)","昼寝(分)","サウナ","お風呂・肌ケア","マウスケア","タンパク質","歩数(歩)","水分(ml)","業務時間(分)","仕事の重さ","休肝日","外食","誰と","ひとこと"]
    .concat(perDayParts().map(function(p){return p.label;}))
    .concat(MOOD.parts.map(function(p){return p.label+"の気分";}))
    .concat(data.custom.map(function(c){return c.label;}));

      e.bedtimeMin!=null?e.bedtimeMin:"",
      e.wakeMin!=null?e.wakeMin:"",
      e.sleepFeel!=null?SLEEP_OPTS[e.sleepFeel]:"",
      e.youtubeMin!=null?e.youtubeMin:"",

      // 旧列を残すのは v4.7 より前の日の記録が読めなくなるため。新しい日は右の列にだけ入る
      b(e.study), e.studyMin!=null?e.studyMin:"", e.meditationMin!=null?e.meditationMin:"", e.napMin!=null?e.napMin:"",
      b(e.sauna), b(e.bath), b(e.mouth), b(e.protein), e.stepsCount!=null?e.stepsCount:"", e.waterMl!=null?e.waterMl:"", e.workMin!=null?e.workMin:"", e.workLoad!=null?LOAD_OPTS[e.workLoad]:"", b(e.sober),
      b(e.eatout),
      e.companion!=null?COMPANION_OPTS[e.companion]:"",

      e.memo!=null?e.memo:""]
      .concat(perDayParts().map(function(p){return b(e[p.id]);}))
      .concat(MOOD.parts.map(function(p){return e[p.id]!=null?MOOD_OPTS[e[p.id]]:"";}))

/* ================= 状態 ================= */
var loadError = null;   // 起動時の読み込み事故をユーザーに見せるための文言
var saveBlocked = false; // 原本を退避できなかった場合、上書きによる不可逆消失を止める
function load(){
  var t;
  try { t = localStorage.getItem(KEY); }
  catch(e) {
    console.error("[flourish] localStorage を読めませんでした", e);
    loadError = "保存領域を読み書きできません。今日の入力は保存されない可能性があります。";
    return defaultData();
  }
  if (!t) return defaultData();
  try { return migrate(JSON.parse(t)); }
  catch(e) {
    console.error("[flourish] 保存データを解析できませんでした", e);
    // 初期状態のまま save() すると原本を上書きして復旧不能になるため、先に別キーへ退避する
    var bk = BROKEN_PREFIX + fmt(new Date());
    try {
      localStorage.setItem(bk, t);
      loadError = "保存データを読めなかったため、記録を空の状態で開始しています。読めなかったデータは退避済みです（設定タブ →「データ」から取り出せます）。";
    } catch(e2) {
      console.error("[flourish] 破損データの退避に失敗しました", e2);
      saveBlocked = true;
      loadError = "保存データを読めず、退避もできませんでした。原本を守るため保存を停止しています。この画面を閉じずにオーナーに連絡してください。";
    }
    return defaultData();
  }
}
function brokenKeys(){
  var ks = [];
  try {
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && k.indexOf(BROKEN_PREFIX) === 0) ks.push(k);
    }
  } catch(e) { console.error("[flourish] 退避データを列挙できませんでした", e); }
  return ks.sort();
}

// 取り込み(migrate)の対象外にもなるので、他人のJSONを取り込んでも送信先は書き換わらない。

function loadSync(){
  var d = {url:"", token:"", last:null};
  try {
    var t = localStorage.getItem(SYNC_KEY);
    if (!t) return d;
    var o = JSON.parse(t);
    return {
      url: typeof o.url === "string" ? o.url : "",
      token: typeof o.token === "string" ? o.token : "",
      last: typeof o.last === "string" ? o.last : null,
    };
  } catch(e) {
    console.error("[flourish] 同期設定を読めませんでした", e);

/* ===== 勉強タイマー =====
 *
 * **経過時間を数えない。開始時刻だけを持ち、止めるときに「今 − 開始」で出す。**
 * iOS のホーム画面PWAはバックグラウンドで動けないので、setInterval で数えると
 * 画面を消した瞬間に止まり、実際より短い時間が記録される(勉強中は普通、画面を消す)。
 *
 * 本体データと別キーに置くのは同期設定と同じ理由。走っている最中の状態は記録ではないので、
 * バックアップJSON・週報・台帳のどれにも混ぜたくない。migrate の対象外でもある。
 *
 * 記録先は「開始した日の翌日」。studyMin は前日を指すフィールドなので、
 * 今日の勉強は明日ぶんのエントリに入る(先取り入力が明日までなのと同じ向き)。

var TIMER_KEY = KEY + "-timer";
// 計測できる種別。**記録先フィールドとラベルの出所はここだけ**にする(分岐に書き写すと
// 種別を足したとき片方だけ古いまま残る)。どちらも前日を指すので timerTarget は共通でよい
var TIMER_KINDS = [{id:"study", field:"studyMin", label:"勉強"}, {id:"meditation", field:"meditationMin", label:"瞑想"}];
// 不正な kind は既定へ倒す。v4.16 以前の走行中の状態は kind を持たない(当時は勉強専用)ので、
// リロードしただけで記録先が消えないよう study として読む
function timerKind(id){
  for (var i=0;i<TIMER_KINDS.length;i++) if (TIMER_KINDS[i].id === id) return TIMER_KINDS[i];
  return TIMER_KINDS[0];
}
// 止め忘れの上限。これを超えた経過は記録せず、手入力に回す。
// 黙って巨大な値を書き込むと、週の合計が一度で壊れ、しかも原因が分からなくなる
var TIMER_MAX_MIN = 360;
var timerState = loadTimer();

function loadTimer(){
  try {
    var t = localStorage.getItem(TIMER_KEY);
    if (!t) return null;
    var o = JSON.parse(t);
    if (!o || typeof o.startedAt !== "number" || !isFinite(o.startedAt)) return null;
    if (typeof o.day !== "string") return null;
    return {startedAt: o.startedAt, day: o.day, kind: timerKind(o.kind).id};
  } catch(e) {
    console.error("[flourish] タイマーの状態を読めませんでした", e);
    return null;
  }
}
function persistTimer(){
  try {
    if (timerState) localStorage.setItem(TIMER_KEY, JSON.stringify(timerState));
    else localStorage.removeItem(TIMER_KEY);
  } catch(e) { console.error("[flourish] タイマーの状態を保存できませんでした", e); }
}
/** 開始した日の計測は翌日ぶんのエントリに入る(studyMin / meditationMin はどちらも前日を指すため) */
function timerTarget(day){ return fmt(addDays(parseD(day), 1)); }
function timerElapsedSec(){
  if (!timerState) return 0;
  return Math.max(0, Math.floor((Date.now() - timerState.startedAt) / 1000));
}
// 記録する分。秒は四捨五入する(切り捨てると 59秒の勉強が 0 分になる)
function timerElapsedMin(){
  if (!timerState) return 0;
  return Math.max(0, Math.round((Date.now() - timerState.startedAt) / 60000));
}
/** 走行中の表示。ストップウォッチなので秒まで出す(記録値の fmtDur とは別) */
function fmtClock(sec){
  var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return (h > 0 ? h + ":" + pad(m) : String(m)) + ":" + pad(s);
}

/* 経過表示の更新。
 *
 * **数えるのではなく、毎回 startedAt から引き直す。** interval を計数に使うと
 * バックグラウンドで止まった時間がそのまま欠測になるが、引き直すだけなら
 * 止まっていた間も復帰後の最初の tick で正しい値に戻る。
 * 更新は経過の桁だけを書き換える。render() を毎秒呼ぶと innerHTML を丸ごと差し替えることになり、
 * select を開いている最中に閉じるなどの実害が出る。
 */
var timerTick = null;
function timerPaint(){
  var el = document.getElementById("timerElapsed");
  if (el) el.textContent = fmtClock(timerElapsedSec());
}
function timerTickStart(){
  timerTickStop();
  if (!timerState) return;
  timerPaint();
  timerTick = setInterval(timerPaint, 1000);
}
function timerTickStop(){
  if (timerTick !== null) { clearInterval(timerTick); timerTick = null; }
}
// CSP が https://*.ts.net しか許さないので、それ以外を入れても送信は黙って失敗する。
// 違反はコンソールにしか出ず画面からは理由が分からないため、入口で弾いて理由を見せる
function syncUrlOk(u){
  return typeof u === "string" && /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.ts\.net(\/[^\s]*)?$/i.test(u);
}
function syncReady(){ return syncUrlOk(syncCfg.url) && syncCfg.token !== ""; }
// 朝は十数回タップする。その都度送らずにまとめる
function scheduleSync(){
  if (!syncReady()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncPush, 4000);
}
function syncPush(){
  clearTimeout(syncTimer);
  if (!syncReady()) return;
  if (typeof fetch !== "function") {
    console.error("[flourish] この環境には fetch がありません");
    syncNote = {ok:false, msg:"この端末では同期できません"};
    showSyncNote();
    return;
  }
  fetch(syncCfg.url, {
    method: "POST",
    headers: {"Content-Type":"application/json", "Authorization":"Bearer " + syncCfg.token},
    body: JSON.stringify(S),
  // 成功側で throw すると .then(ok, err) の err は呼ばれず、未処理の rejection になる。
  // 失敗の扱いを1箇所にまとめて、応答が返った場合も返らなかった場合もここを通す
  }).then(function(res){
    if (!res || !res.ok) { syncFailed(new Error("HTTP " + (res && res.status))); return; }
    // 200 は受信側がファイルを書き終えた合図。ここまで来て初めて「実際に持ち出せた」
    syncCfg.last = fmt(new Date());
    saveSync();
    S.lastBackup = syncCfg.last;
    persistQuiet();
    syncNote = {ok:true, msg:"同期しました"};
    showSyncNote();
  }, syncFailed);
}
// PCが落ちている・tailnet に繋がっていないのは日常的に起きる。記録は端末に残るので
// アプリは止めず、設定タブで事実だけ見せる(催促はしない)
function syncFailed(e){
  console.error("[flourish] 同期できませんでした", e);
  syncNote = {ok:false, msg:"同期できませんでした(記録は端末に残っています)"};
  showSyncNote();
}
// 全再描画にすると、設定タブで書きかけの取り込みJSON・カスタム項目名・トークンが消える。
// 同期の結果は1行だけなので、その要素だけ差し替える
function showSyncNote(){
  if (tab !== "settings") return;
  var el = document.getElementById("syncline");
  if (!el) { render(); return; }
  el.outerHTML = syncLine();
}

function copyText(t, done){
  var p;
  try { p = navigator.clipboard && navigator.clipboard.writeText(t); }
  catch(e) { console.error("[flourish] クリップボードを呼べませんでした", e); done(false); return; }
  if (!p || typeof p.then !== "function") { done(false); return; }
  p.then(function(){ done(true); }, function(e){
    console.error("[flourish] クリップボードへ書き込めませんでした", e);
    done(false);
  });
}

/* ================= 部品HTML ================= */
function seg(f, opts, val, colors){
  var h = '<div class="seg" style="grid-template-columns:repeat('+opts.length+',1fr)">';
  opts.forEach(function(o,i){
    var on = val === i;
    h += '<button class="sb'+(on?' on '+colors[i]:'')+'" data-f="'+esc(f)+'" data-v="'+i+'" aria-pressed="'+on+'">'+esc(o)+'</button>';
  });
  return h + '</div>';
}
// 休肝日のように「した/しなかった」では意味が通らない項目があるので、ラベルだけ差し替えられるようにする。
// 達成側(✓)は常に data-v="t" なので、色と達成判定の向きは項目によらず一定に保てる
// opts.neutral: 両側とも灰色にする。達成判定を持たない項目で使う。
// 既定の pine/gray は「✓ が良い」を色で言うので、良し悪しの無い事実
// (外食したか等)に付けると画面が価値判断をしてしまう。companion が seg で
// on-gray を並べているのと同じ趣旨(制約6「計測のみ」の系)
function pairBtn(f, val, lab, opts){
  lab = lab || {};
  var neutral = !!(opts && opts.neutral);
  function b(v, text){
    var on = val === (v==="t");
    var cls = (v==="t" && !neutral) ? "on-pine" : "on-gray";
    return '<button class="sb'+(on?' on '+cls:'')+'" data-f="'+esc(f)+'" data-v="'+v+'" aria-pressed="'+on+'">'+text+'</button>';
  }
  return '<div class="seg" style="grid-template-columns:1fr 1fr">'
    + b("t", lab.t || "✓ した") + b("f", lab.f || "✗ しなかった") + '</div>';
}
// 分の実値を選ぶ select。空欄「—」が未入力で、選び直せば未入力へ戻せる(seg の同値タップに相当)。
// 保存値が選択肢に無いとき(v9 で移行した「以降」相当の 1512 / 492 など)だけ、その値の option を足す。
// 足さないと、値があるのに無選択で描かれ、見えないまま別の値を選んだ瞬間に消える
function minSelect(f, opts, val, fmt){
  var list = opts;
  if (val != null && opts.indexOf(val) < 0) {
    list = opts.concat([val]).sort(function(a,b){ return a-b; });
  }
  var h = '<select class="msel" data-f="'+esc(f)+'"><option value=""'+(val==null?' selected':'')+'>—</option>';
  list.forEach(function(v){
    h += '<option value="'+v+'"'+(val===v?' selected':'')+'>'+esc(fmt(v))+'</option>';
  });
  return h + '</select>';
}
function row(label, sub, inner){
  return '<div class="row"><div class="rowhead"><span class="lbl">'+esc(label)+'</span>'
    + (sub ? '<span class="sub">'+esc(sub)+'</span>' : '') + '</div>' + inner + '</div>';
}

    + '</div>';
  if (run) {
    // 中身は timerPaint() が毎秒書き換える。ここでは初期値だけ入れる
    h += '<div class="mono" id="timerElapsed" style="font-size:34px;text-align:center;padding:16px 0;'
      + 'font-variant-numeric:tabular-nums">' + esc(fmtClock(timerElapsedSec())) + '</div>'
      + '<button class="sb on on-pine" data-action="timerStop" style="width:100%;padding:12px">■ 停止して記録</button>';
  } else {
    // 走行中は停止だけを出す。開始ボタンを残すと「別の種別なら押せる」と読めるが、
    // 状態は単一なので実際には押せない(押しても排他で弾かれる)
    h += '<div style="display:flex;gap:8px">' + TIMER_KINDS.map(function(k){
      return '<button class="sb on on-pine" data-action="timerStart" data-kind="' + esc(k.id)
        + '" style="flex:1;padding:12px">▶ ' + esc(k.label) + '</button>';
    }).join("") + '</div>';
  }
  h += '</div>';
  // 累計は種別ぶん並べる。出所を TIMER_KINDS にしてあるので、種別を足すと自動でここにも出る
  h += '<div class="card"><div class="chead"><span class="ctitle">' + esc(md(tgt)) + ' の記録</span></div>';
  h += TIMER_KINDS.map(function(k){
    var acc = (S.entries[tgt] || {})[k.field];
    return '<div class="srow"><span style="font-size:14px">' + esc(k.label) + '</span>'
      + '<span class="mono" style="color:var(--sub)">' + esc(typeof acc === "number" ? fmtDur(acc) : "—") + '</span></div>';
  }).join("");
  h += '<p style="font-size:13px;color:var(--sub);padding:4px 0 0">'
    + '今日の計測は、記録タブでは ' + esc(md(tgt)) + ' の欄に入ります'
    + '(どちらも前日ぶんを翌日に記録するため)。手で直すときはそちらから。</p></div>';
  h += '<p class="foot">タイマーは開始時刻だけを覚えます。アプリを閉じても経過は進み、'
    + '止めたときに実時間で記録します。押し忘れたぶんは記録タブで直接入力できます。</p>';
  return h;
}
/* ================= 週 ================= */
function viewWeek(today){
  var ws = weekStart(parseD(today));
  var days=[]; for (var i=0;i<7;i++) days.push(fmt(addDays(ws,i)));
  var logged = days.filter(function(dt){ return dt<=today && S.entries[dt]; }).length;
  var passed = days.filter(function(dt){ return dt<=today; }).length;
  var items = allItems(S).filter(function(it){ return S.enabled[it.id] !== false; });
  // weekStats も同じ allItems→enabled の順で並べるので添字が一致する
  var prev = weekStats(S, addDays(ws,-7), today).items;

  var h = '<div class="card"><div class="chead"><span class="ctitle">今週 '+md(days[0])+' – '+md(days[6])+'</span>'
    + '<span class="cright mono">入力 '+logged+'/'+passed+'日</span></div>';
  h += '<div class="dhead">'+WDAY.map(function(w){return '<span class="dh">'+w+'</span>';}).join("")+'</div>';

  items.forEach(function(it, i){
    var ok=0, dots='';
    days.forEach(function(dt){
      var st;
      if (dt > today) st = "fut";
      else {
        var a = achieved(S, S.entries[dt], it.id);
        if (a === null) st = "miss"; else if (a) { st = "ok"; ok++; } else st = "ng";
      }
      dots += '<span class="dot '+st+'"></span>';
    });
    var hit = ok >= it.tgt;
    // 前週は数値のみ。増減の矢印や色を付けると「下がった」という評価になり、比較の目的から外れる
    var p = prev[i];
    var pnote = (p && p.entered > 0) ? '<span class="wc mono" style="color:var(--dim)">前週 '+p.ok+'</span>' : '';
    h += '<div class="wrow"><div class="wname"><span class="wl">'+esc(it.label)+'</span>'
      + '<span class="wc mono" style="color:'+(hit?'var(--pine)':'var(--sub)')+'">'+ok+'/'+it.tgt+'</span>'
      + pnote + '</div>'
      + '<div class="dots">'+dots+'</div></div>';
  });

  if (S.enabled.wakeMin) {
    var wd='';
    days.forEach(function(dt){
      if (dt > today) { wd += '<span class="dot fut"></span>'; return; }
      var v = (S.entries[dt]||{}).wakeMin;
      if (v == null) { wd += '<span class="dot miss"></span>'; return; }
      // 見たいのは良し悪しではなく起床時刻のばらつきなので、濃淡だけで早い→遅いを示す
      wd += '<span class="dot" style="background:var(--indigo);opacity:'+wakeOpacity(v)+'"></span>';
    });
    h += '<div class="wrow"><div class="wname"><span class="wl">起床時刻</span><span class="wc" style="color:var(--sub)">計測のみ</span></div>'
      + '<div class="dots">'+wd+'</div></div>';
  }
  if (S.enabled.sleepFeel) {
    var fd='';
    days.forEach(function(dt){
      if (dt > today) { fd += '<span class="dot fut"></span>'; return; }
      var v = (S.entries[dt]||{}).sleepFeel;
      if (v == null) { fd += '<span class="dot miss"></span>'; return; }
      var col = v===0 ? 'var(--pine)' : v===1 ? '#8A9388' : 'var(--sienna)';
      fd += '<span class="dot" style="background:'+col+'"></span>';
    });
    h += '<div class="wrow"><div class="wname"><span class="wl">眠れた感</span><span class="wc" style="color:var(--sub)">計測のみ</span></div>'
      + '<div class="dots">'+fd+'</div></div>';
  }
  h += '</div><p class="foot">主指標は週次達成率です。連続日数は表示しません(断絶時の全崩れを防ぐため)。</p>';
  return h;
}

/* ================= 推移(SVGチャート) ================= */
// 90日表示では7日ごとのラベルが詰まって読めなくなるので、点数に応じて間引く
function xLabelStep(n){ return Math.max(1, Math.round(n/4)); }
function svgChart(rows, key, yMin, yMax, yTicks, refY, color){
  var W=320, H=150, L=44, R=8, T=8, B=20;
  var iw = W-L-R, ih = H-T-B;
  function X(i){ return L + (rows.length<=1 ? 0 : i/(rows.length-1)*iw); }
  function Y(v){ return T + (1-(v-yMin)/(yMax-yMin))*ih; }
  var h = '<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  yTicks.forEach(function(t){
    h += '<line x1="'+L+'" y1="'+Y(t.v)+'" x2="'+(W-R)+'" y2="'+Y(t.v)+'" stroke="#E3E7DE" stroke-width="1"/>';
    h += '<text x="'+(L-6)+'" y="'+(Y(t.v)+3)+'" font-size="9" fill="#71806F" text-anchor="end">'+t.l+'</text>';
  });
  if (refY != null) h += '<line x1="'+L+'" y1="'+Y(refY)+'" x2="'+(W-R)+'" y2="'+Y(refY)+'" stroke="#3E6B4F" stroke-width="1.5" stroke-dasharray="4 4"/>';
  var step = xLabelStep(rows.length);
  rows.forEach(function(r,i){
    if (i % step === 0 || i === rows.length-1) {
      h += '<text x="'+X(i)+'" y="'+(H-6)+'" font-size="9" fill="#71806F" text-anchor="middle">'+r.d+'</text>';
    }
  });
  var path='', pen=false;
  rows.forEach(function(r,i){
    var v = r[key];
    if (v == null) { pen=false; return; }
    path += (pen ? ' L ' : ' M ') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1);
    pen = true;
  });
  if (path) h += '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
  // 90日ぶんの点は互いに3pxしか離れず塊になるので、短い期間のときだけ打つ
  if (rows.length <= 31) {
    rows.forEach(function(r,i){
      var v = r[key];
      if (v == null) return;
      h += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.5" fill="'+color+'"/>';
    });
  }
  return h + '</svg>';
}
// 就寝と起床を同じ時刻軸に載せ、その間隔で睡眠の長さを示す。長さを「◯時間」と数値では出さない。
// 両端は選択肢の遅い側の端であって実測ではないので、断定するとバケット幅の誤差が見えなくなる
function svgSleep(rows){
  // 就寝(22:00〜26:00)と翌朝の起床(+24 で 29:00〜34:00)の両方を覆う。範囲は選択肢から導く
  var yMin=BEDTIME_MIN[0]/60-0.2, yMax=WAKE_MIN[WAKE_MIN.length-1]/60+24+0.2;
  var yTicks=[];
  for (var sv=Math.ceil(yMin); sv<=Math.floor(yMax); sv+=2) yTicks.push({v:sv, l:fmtHM((sv%24)*60)});
  var W=320, H=150, L=44, R=8, T=8, B=20;
  var iw = W-L-R, ih = H-T-B;
  function X(i){ return L + (rows.length<=1 ? 0 : i/(rows.length-1)*iw); }
  function Y(v){ return T + (1-(v-yMin)/(yMax-yMin))*ih; }
  var h = '<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  yTicks.forEach(function(t){
    h += '<line x1="'+L+'" y1="'+Y(t.v)+'" x2="'+(W-R)+'" y2="'+Y(t.v)+'" stroke="#E3E7DE" stroke-width="1"/>';
    h += '<text x="'+(L-6)+'" y="'+(Y(t.v)+3)+'" font-size="9" fill="#71806F" text-anchor="end">'+t.l+'</text>';
  });
  var step = xLabelStep(rows.length);
  rows.forEach(function(r,i){
    if (i % step === 0 || i === rows.length-1) {
      h += '<text x="'+X(i)+'" y="'+(H-6)+'" font-size="9" fill="#71806F" text-anchor="middle">'+r.d+'</text>';
    }
  });
  // 両方そろった連続区間ごとに塗る。欠損をまたいで塗ると、記録のない夜まで眠っていたことになる
  var run=[];
  function flush(){
    if (run.length === 1) {
      h += '<line x1="'+X(run[0].i).toFixed(1)+'" y1="'+Y(run[0].b).toFixed(1)
        + '" x2="'+X(run[0].i).toFixed(1)+'" y2="'+Y(run[0].w).toFixed(1)
        + '" stroke="#43507A" stroke-opacity=".28" stroke-width="2"/>';
    } else if (run.length > 1) {
      var d='';
      run.forEach(function(p,k){ d += (k ? ' L ' : 'M ') + X(p.i).toFixed(1) + ' ' + Y(p.b).toFixed(1); });
      for (var k=run.length-1; k>=0; k--) d += ' L ' + X(run[k].i).toFixed(1) + ' ' + Y(run[k].w).toFixed(1);
      h += '<path d="'+d+' Z" fill="#43507A" fill-opacity=".14"/>';
    }
    run=[];
  }
  rows.forEach(function(r,i){
    if (r.bed!=null && r.wakeAbs!=null) run.push({i:i, b:r.bed, w:r.wakeAbs});
    else flush();
  });
  flush();
  ["bed","wakeAbs"].forEach(function(key){
    var path='', pen=false;
    rows.forEach(function(r,i){
      var v = r[key];
      if (v == null) { pen=false; return; }
      path += (pen ? ' L ' : ' M ') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1);
      pen = true;
    });
    if (path) h += '<path d="'+path+'" fill="none" stroke="#43507A" stroke-width="2"/>';
  });
  return h + '</svg>';
}
// 週タブのドット語彙(達成 / 未達 / 未入力 / 未来)を1ヶ月に伸ばしたもの。
// 連続日数は出さない(制約1)。未入力は miss として未達と区別する(制約2)。
// 月ごとの目標は持たないので、達成数と記録数を事実として並べるだけにする
function viewMonth(today){
  var items = allItems(S).filter(function(it){ return S.enabled[it.id] !== false; });
  if (!items.length) return "";
  var cur = items.filter(function(it){ return it.id === monItem; })[0] || items[0];
  var t = parseD(today);
  var base = new Date(t.getFullYear(), t.getMonth() + monOff, 1);
  var last = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  var ym = base.getFullYear() + "-" + pad(base.getMonth()+1);
  // 記録より前の月へは戻さない。空のカレンダーをめくれても読むものが無い
  var keys = Object.keys(S.entries).sort();
  var cells = '', ok = 0, ent = 0;
  for (var i=0;i<monIdx(base);i++) cells += '<div class="mcell"></div>';
  for (var d=1; d<=last; d++){
    var dt = fmt(new Date(base.getFullYear(), base.getMonth(), d)), st;
    if (dt > today) st = "fut";
    else {
      var a = achieved(S, S.entries[dt], cur.id);
      if (a === null) st = "miss"; else { ent++; if (a) { st = "ok"; ok++; } else st = "ng"; }
    }
    cells += '<div class="mcell"><span class="mday mono">'+d+'</span><span class="dot '+st+'"></span></div>';
  }
  var opts = '';
  items.forEach(function(it){
    opts += '<option value="'+esc(it.id)+'"'+(it.id===cur.id?' selected':'')+'>'+esc(it.label)+'</option>';
  });
  return '<div class="card"><div class="chead"><span class="ctitle">月間</span>'
    + '<span class="cright mono">達成 '+ok+' / 記録 '+ent+'</span></div>'
    + '<div class="datebar">'
    + '<button class="navbtn" data-mo="-1"'+(keys.length && ym > keys[0].slice(0,7) ? '' : ' disabled')+'>‹</button>'
    + '<div class="datec"><div class="dateT">'+base.getFullYear()+'年'+(base.getMonth()+1)+'月</div></div>'
    + '<button class="navbtn" data-mo="1"'+(monOff < 0 ? '' : ' disabled')+'>›</button></div>'
    + '<div class="srow" style="border-top:0;padding-top:0"><select data-mon="1">'+opts+'</select></div>'
    + '<div class="mhead">'+WDAY.map(function(w){return '<span class="mh">'+w+'</span>';}).join("")+'</div>'
    + '<div class="mgrid">'+cells+'</div></div>';
}

function viewTrend(today){
  var rows=[];
  for (var i=trendDays-1;i>=0;i--){
    var dt = fmt(addDays(parseD(today), -i));
    var e = S.entries[dt] || {};
    // weightVal は自由入力かつ migrate() の正規化対象外(entries は素通し)なので、
    // NaN が軸の目盛りと折れ線の座標に伝播しないよう読み出し側で数値か確かめる
    var wn = Number(e.weightVal);
    rows.push({d: md(dt),
      // 分の実値をそのまま時角へ。旧 BEDTIME_VAL / WAKE_VAL の対応表は役目を終えた
      bed: e.bedtimeMin!=null ? e.bedtimeMin/60 : null,
      wake: e.wakeMin!=null ? e.wakeMin/60 : null,
      // 帯グラフでは就寝と同じ時刻軸に載せるので、翌朝であることを +24 で表す
      wakeAbs: e.wakeMin!=null ? e.wakeMin/60+24 : null,
      yt: e.youtubeMin!=null ? e.youtubeMin : null,
      steps: e.stepsCount!=null ? e.stepsCount : null,
      w: (e.weightVal!=null && e.weightVal!=="" && isFinite(wn)) ? wn : null});
  }
  var lab = "(" + trendDays + "日)";
  var h = viewMonth(today) + '<div class="seg" style="grid-template-columns:1fr 1fr;margin-bottom:12px">';
  TREND_OPTS.forEach(function(d){
    var on = trendDays === d;
    h += '<button class="sb'+(on?' on on-gray':'')+'" data-td="'+d+'" aria-pressed="'+on+'">'+d+'日</button>';
  });
  h += '</div>';

  // 目盛りは選択肢の範囲から1時間刻みで導く。刻みを変えても軸が勝手に付いてくる
  function hourTicks(opts){
    var a=[], lo=Math.ceil(opts[0]/60), hi=Math.floor(opts[opts.length-1]/60);
    for (var x=lo; x<=hi; x++) a.push({v:x, l:fmtHM(x*60)});
    return a;
  }
  var bedLo = BEDTIME_MIN[0]/60, bedHi = BEDTIME_MIN[BEDTIME_MIN.length-1]/60;
  var wakeLo = WAKE_MIN[0]/60, wakeHi = WAKE_MIN[WAKE_MIN.length-1]/60;
  h += '<div class="card"><div class="chead"><span class="ctitle">就寝時刻'+lab+'</span></div><div class="chartbox">'
    + svgChart(rows,"bed",bedLo-0.2,bedHi+0.2,hourTicks(BEDTIME_MIN),S.th.bedtimeMin/60,"#43507A") + '</div></div>';
  // 達成ラインを持たない項目なので基準線(refY)は引かない
  h += '<div class="card"><div class="chead"><span class="ctitle">起床時刻'+lab+'</span></div><div class="chartbox">'
    + svgChart(rows,"wake",wakeLo-0.2,wakeHi+0.2,hourTicks(WAKE_MIN),null,"#43507A") + '</div></div>';

  // 体重チャートと同じく、描くものがある日が出てから表示する
  if (rows.some(function(r){ return r.bed!=null && r.wakeAbs!=null; })) {
    h += '<div class="card"><div class="chead"><span class="ctitle">睡眠'+lab+'</span></div><div class="chartbox">'
      + svgSleep(rows) + '</div>'
      + '<p class="foot">上の線が起床、下の線が就寝で、帯の広さがおおよその睡眠の長さです。'
      + 'v3.1 までの記録は選択肢の遅い側の端(「〜23:30」なら23:30)で、実際の時刻は最大30分早い側にあります。'
      + 'v4.0 以降は選んだ時刻そのものです。</p></div>';
  } else {
    h += '<p class="foot">就寝と起床の両方を記録した日ができると、ここに睡眠の帯が表示されます。</p>';
  }

  // 分軸。目盛りは2時間ごとに置く(左余白44pxに収まる短さが要件)
  var ytHi = YT_MIN[YT_MIN.length-1], ytT=[];
  for (var yv=0; yv<=ytHi; yv+=120) ytT.push({v:yv, l:fmtDur(yv)});
  h += '<div class="card"><div class="chead"><span class="ctitle">YouTube'+lab+'</span></div><div class="chartbox">'
    + svgChart(rows,"yt",-ytHi*0.04,ytHi*1.04,ytT,S.th.youtubeMin,"#A9663B") + '</div></div>';
  var stT=[0,5000,10000,15000,20000].map(function(v){return {v:v,l:fmtSteps(v)};});
  h += '<div class="card"><div class="chead"><span class="ctitle">歩数'+lab+'</span></div><div class="chartbox">'
    + svgChart(rows,"steps",-800,20800,stT,S.th.stepsCount,"#3E6B4F") + '</div></div>';
  var ws = rows.filter(function(r){return r.w!=null;}).map(function(r){return r.w;});
  if (ws.length) {
    var mn=Math.min.apply(null,ws)-0.5, mx=Math.max.apply(null,ws)+0.5;
    var wt=[{v:mn+0.5,l:(mn+0.5).toFixed(1)},{v:(mn+mx)/2,l:((mn+mx)/2).toFixed(1)},{v:mx-0.5,l:(mx-0.5).toFixed(1)}];
    h += '<div class="card"><div class="chead"><span class="ctitle">体重'+lab+'</span></div><div class="chartbox">'
      + svgChart(rows,"w",mn,mx,wt,null,"#3E6B4F") + '</div></div>';
  } else {
    h += '<p class="foot">体重の数値を入力すると、ここに推移が表示されます。</p>';
  }
  return h;
}

/* ================= 週報 ================= */
function viewReview(today){
  var stats = weekStats(S, weekStart(parseD(today)), today);
  var h = '<div class="card"><div class="chead"><span class="ctitle">今週のサマリー '+stats.range+'</span></div><div class="chips">';
  stats.items.forEach(function(it){
    h += '<span class="chip mono'+(it.ok>=it.target?' hit':'')+'">'+esc(it.label)+' '+it.ok+'/'+it.target+'</span>';
  });
  h += '</div></div>';
  h += '<button class="bigbtn" data-action="copyreview"'+(stats.logged===0?' disabled style="background:var(--dim)"':'')+'>週報用データをコピー</button>';
  h += '<p class="foot">コピーしてClaudeのチャット(このプロジェクト)に貼り付けると、【事実】【解釈】【来週の一点】形式の週次レビューが返ってきます。</p>';
  if (revText != null) {
    h += '<p class="note" id="revnote" style="color:'+(revNote.indexOf("しました")>=0?'var(--pine)':'var(--sub)')+'">'+esc(revNote)+'</p>';
    h += '<textarea readonly rows="5" id="revout">'+esc(revText)+'</textarea>';
  }

  var n = Object.keys(S.entries).length;
  h += '<div class="card"><div class="chead"><span class="ctitle">相関ヒント</span></div>';
  if (n < 28) {
    h += '<p style="font-size:13px;color:var(--sub);padding:10px 0">🔒 28日分の記録で解禁(現在 <span class="mono">'+n+'/28</span>)。少ないデータの相関はノイズです。</p>';
  } else {
    var es = Object.keys(S.entries).map(function(k){ return S.entries[k]; });
    function mk(fa, fb){
      var ps=[];
      es.forEach(function(e){
        var x=fa(e), y=fb(e);
        if (x!=null && y!=null) ps.push([x,y]);
      });
      return ps;
    }
    // 気分は3枠あるが、相関は朝の値だけを使う。前夜・当朝の要因と時間的に最も近く、
    // 昼・晩は日中の出来事が挟まって向きが読めなくなるため(掘り下げは週報→Claude 側に置く)
    function moodAM(e){ return e.moodM==null?null:e.moodM===0; }
    var defs=[
      {l:"就寝が達成ライン内 × 眠れた感「良」", ps:mk(function(e){return e.bedtimeMin==null?null:e.bedtimeMin<=S.th.bedtimeMin;}, function(e){return e.sleepFeel==null?null:e.sleepFeel===0;})},
      {l:"起床が〜6:30以内 × 眠れた感「良」", ps:mk(function(e){return e.wakeMin==null?null:e.wakeMin<=390;}, function(e){return e.sleepFeel==null?null:e.sleepFeel===0;})},
      {l:"YouTube多め(〜2h以上) × 就寝が遅い", ps:mk(function(e){return e.youtubeMin==null?null:e.youtubeMin>60;}, function(e){return e.bedtimeMin==null?null:e.bedtimeMin>S.th.bedtimeMin;})},
      {l:"アシュワガンダを飲んだ × 眠れた感「良」", ps:mk(function(e){return e.ashwagandha==null?null:e.ashwagandha===true;}, function(e){return e.sleepFeel==null?null:e.sleepFeel===0;})},
      {l:"就寝が達成ライン内 × 起床が〜6:30以内", ps:mk(function(e){return e.bedtimeMin==null?null:e.bedtimeMin<=S.th.bedtimeMin;}, function(e){return e.wakeMin==null?null:e.wakeMin<=390;})},
      {l:"ジムをした × 眠れた感「良」", ps:mk(function(e){return e.gym==null?null:e.gym===true;}, function(e){return e.sleepFeel==null?null:e.sleepFeel===0;})},
      // 達成の判定は studyDone に一元化。旧データ(真偽値)と新データ(分)が混ざった期間でも
      // 週タブと同じ結果になる。ここで e.study を直接見ると、移行後に相関ヒントだけ静かに欠ける
      {l:"勉強した × YouTube多め", ps:mk(function(e){return studyDone(S, e);}, function(e){return e.youtubeMin==null?null:e.youtubeMin>60;})},
      // 瞑想は主観状態との突き合わせのために足した項目なので、対も眠れた感と朝の気分に置く。
      // 達成ラインは可変なので th を直接見る(閾値を変えると過去の対の意味も変わるのは他項目と同じ)
      {l:"瞑想が達成ライン以上 × 眠れた感「良」", ps:mk(function(e){return e.meditationMin==null?null:e.meditationMin>=S.th.meditationMin;}, function(e){return e.sleepFeel==null?null:e.sleepFeel===0;})},
      {l:"瞑想が達成ライン以上 × 朝の気分「高」", ps:mk(function(e){return e.meditationMin==null?null:e.meditationMin>=S.th.meditationMin;}, function(e){return e.moodM==null?null:e.moodM===0;})},
      // 昼寝は達成ラインを持たないので、二値化は「した/していない」。0分を選んだ日が「していない」で、
      // 未入力(null)は mk が両方揃った日だけを拾うので分母に入らない。
      // 対を眠れた感と朝の気分に置くのは瞑想と同じだが、期待する向きは逆でよい —
      // 睡眠圧を下げるぶん夜に響きうるのが昼寝の主なコストで、アプリで測れるのはそこだけ
      // (日中の集中力・脳疲労の項目は持たないため、効いているかは測れない)
      {l:"前日に昼寝した × 眠れた感「良」", ps:mk(function(e){return e.napMin==null?null:e.napMin>0;}, function(e){return e.sleepFeel==null?null:e.sleepFeel===0;})},
      {l:"前日に昼寝した × 朝の気分「高」", ps:mk(function(e){return e.napMin==null?null:e.napMin>0;}, moodAM)},
      // 仕事は他の項目の上流にありうる。棚卸しで「ジムに行けない理由は仕事との摩擦」と出たので、
      // ここだけが「なぜそうなったか」に届く対になる
      {l:"仕事が重い × 前日に酒を飲んだ", ps:mk(function(e){return e.workLoad==null?null:e.workLoad===3;}, function(e){return e.sober==null?null:e.sober===false;})},
      {l:"仕事が重い × 就寝が達成ライン外", ps:mk(function(e){return e.workLoad==null?null:e.workLoad===3;}, function(e){return e.bedtimeMin==null?null:e.bedtimeMin>S.th.bedtimeMin;})},
      {l:"業務時間が8h超 × ジムをした", ps:mk(function(e){return e.workMin==null?null:e.workMin>480;}, function(e){return e.gym==null?null:e.gym===true;})},
      // 休肝日・サウナ・歩数はいずれも前日を指すので、当朝の眠れた感とは同じ一夜を挟んで並ぶ
      {l:"前日に酒を飲んだ × 眠れた感「良」", ps:mk(function(e){return e.sober==null?null:e.sober===false;}, function(e){return e.sleepFeel==null?null:e.sleepFeel===0;})},
      // 外食も前日を指す。献立アプリ(hatchmenu)の履歴は日付を持たず突き合わせられないので、
      // 「外食した日の夜がどうだったか」に届くのはこの2本だけ
      {l:"前日に外食した × 眠れた感「良」", ps:mk(function(e){return e.eatout==null?null:e.eatout===true;}, function(e){return e.sleepFeel==null?null:e.sleepFeel===0;})},
      {l:"サウナに入った × 眠れた感「良」", ps:mk(function(e){return e.sauna==null?null:e.sauna===true;}, function(e){return e.sleepFeel==null?null:e.sleepFeel===0;})},
      {l:"歩数が達成ライン以上 × 眠れた感「良」", ps:mk(function(e){return e.stepsCount==null?null:e.stepsCount>=S.th.stepsCount;}, function(e){return e.sleepFeel==null?null:e.sleepFeel===0;})},
      // ここから気分。眠れた感と対になる組を選んであるので、
      // 「睡眠を経由して効いているのか、直接効いているのか」を並べて読める
      {l:"朝コーヒーを飲んだ × 朝の気分「高」", ps:mk(function(e){return e.coffee==null?null:e.coffee===true;}, moodAM)},
      {l:"アシュワガンダを飲んだ × 朝の気分「高」", ps:mk(function(e){return e.ashwagandha==null?null:e.ashwagandha===true;}, moodAM)},
      {l:"眠れた感「良」× 朝の気分「高」", ps:mk(function(e){return e.sleepFeel==null?null:e.sleepFeel===0;}, moodAM)},
      {l:"就寝が達成ライン内 × 朝の気分「高」", ps:mk(function(e){return e.bedtimeMin==null?null:e.bedtimeMin<=S.th.bedtimeMin;}, moodAM)},
      {l:"前日に酒を飲んだ × 朝の気分「高」", ps:mk(function(e){return e.sober==null?null:e.sober===false;}, moodAM)},
      {l:"前日に外食した × 朝の気分「高」", ps:mk(function(e){return e.eatout==null?null:e.eatout===true;}, moodAM)},
      {l:"ジムをした × 朝の気分「高」", ps:mk(function(e){return e.gym==null?null:e.gym===true;}, moodAM)},
      {l:"歩数が達成ライン以上 × 朝の気分「高」", ps:mk(function(e){return e.stepsCount==null?null:e.stepsCount>=S.th.stepsCount;}, moodAM)},
      // 他項目との相関ではなく、朝のよさが夜まで保つかという日内の見方。
      // 他の行と違い、分母が「晩にもアプリを開いた日」に自己選択される(朝の項目は
      // 同じ入力で一緒に埋まるが、晩の枠は別の機会に開かないと埋まらない)。
      // データからは取り除けないので、条件をラベルに出して読む側に見えるようにする
      {l:"朝の気分「高」× 晩の気分「高」(晩も記録した日だけ)", ps:mk(moodAM, function(e){return e.moodE==null?null:e.moodE===0;})},
    ];
    var res = defs.filter(function(x){return x.ps.length>=14;})
      .map(function(x){var v=phi(x.ps); return {l:x.l, n:x.ps.length, v:v, s:strength(v, x.ps.length)};})
      // 同じ確かさなら記録日数の多い方を上に。φ の大小はその次(見かけの強さで上位を取らせない)
      .sort(function(a,b){ return (b.s-a.s) || (b.n-a.n) || (Math.abs(b.v)-Math.abs(a.v)); });
    if (!res.length) h += '<p style="font-size:13px;color:var(--sub);padding:10px 0">両項目が揃った日がまだ少なく、計算できるペアがありません。</p>';
    else {
      res.forEach(function(x){
        h += '<div class="row"><div style="font-size:13px">'+esc(x.l)+'</div>'
          + '<div class="sub mono">φ='+x.v.toFixed(2)+'('+(x.v>0.1?'正':x.v<-0.1?'負':'ほぼ無')+') n='+x.n+'</div></div>';
      });
      // この段落の中立性は先頭の「相関であって因果ではありません」が残っていることに依存する。
      // 縮めて昼寝の1文だけを残すと、効果があるかもしれない側だけを弁護する文になる
      h += '<p class="foot">相関であって因果ではありません。並びは φ の大きさではなく、'
        + '記録日数を踏まえた確かさの順です(nが少ない行は下がります)。'
        // 昼寝の対は2本とも夜の睡眠側(コスト側)。日中の集中力・脳疲労を測る項目が無いので、
        // 効果側は構造的に出ない。これを書かないと、負の値だけを見て片側で判断することになる。
        // 条件は enabled ではなく「行が実際に出たか」。defs は enabled を見ないので、
        // 表示トグルを off にすると行だけ残って注記が消える(守る対象が残ったまま守りが外れる)
        + (res.some(function(x){ return x.l.indexOf("昼寝") >= 0; }) ? '昼寝は夜の睡眠と朝の気分としか対にできません'
            + '(日中の集中力を測る項目が無いため)。関係が出なくても、効果が無いという意味ではありません。' : '')
        + '</p>';
    }
  }
  h += '</div>';
  return h;
}

/* ================= 設定 ================= */
// 事実だけを淡々と出す。「バックアップしましょう」のような催促文言・バッジ・通知は置かない(設計制約5)
function backupLine(){
  if (!S.lastBackup) return '<p class="note" id="backupline" style="color:var(--sienna)">まだバックアップしていません。</p>';
  var days = Math.round((parseD(fmt(new Date())) - parseD(S.lastBackup)) / 86400000);
  var when = days <= 0 ? "今日" : days + "日前";
  return '<p class="note mono" id="backupline" style="color:'+(days >= 60 ? "var(--sienna)" : "var(--sub)")+'">'
    + '最後のバックアップ: ' + md(S.lastBackup) + '(' + when + ')</p>';
}
// バックアップ日と同じ形。日付の事実だけを出し、増減の評価や指示は付けない
function syncLine(){
  if (syncNote) {
    return '<p class="note" id="syncline" style="color:'+(syncNote.ok?'var(--pine)':'var(--sienna)')+'">'+esc(syncNote.msg)+'</p>';
  }
  if (!syncReady()) return '<p class="note" id="syncline" style="color:var(--sub)">未設定</p>';
  if (!syncCfg.last) return '<p class="note" id="syncline" style="color:var(--sub)">まだ同期していません。</p>';
  var days = Math.round((parseD(fmt(new Date())) - parseD(syncCfg.last)) / 86400000);
  return '<p class="note mono" id="syncline" style="color:var(--sub)">最後の同期: '
    + md(syncCfg.last) + '(' + (days <= 0 ? "今日" : days + "日前") + ')</p>';
}

  return h;
}

/* ================= レンダリング ================= */
var TABS=[["log","記録"],["timer","タイマー"],["week","週"],["trend","推移"],["review","週報"],["settings","設定"]];
function render(){
  var today = fmt(new Date());
  var v = tab==="log" ? viewLog(today)
    : tab==="timer" ? viewTimer(today)
    : tab==="week" ? viewWeek(today)
    : tab==="trend" ? viewTrend(today)
    : tab==="review" ? viewReview(today)
    : viewSettings();
  lastToday = today;
  document.getElementById("banner").innerHTML =
    loadError ? '<div class="banner err">'+esc(loadError)+'</div>' : "";
  document.getElementById("view").innerHTML = v;
  // 経過の器は今の innerHTML と一緒に作り直されるので、参照を持ち直す。
  // タイマータブ以外では止める(見えない要素を毎秒書き換えても意味がない)
  if (tab === "timer" && timerState) timerTickStart(); else timerTickStop();
  document.getElementById("nav").innerHTML = TABS.map(function(t){
    return '<button class="tb'+(tab===t[0]?' on':'')+'" data-nav="'+t[0]+'">'+t[1]+'</button>';
  }).join("");
}

/* ================= 日付またぎ ================= */
// ホーム画面PWAは再読み込みされずに復帰することがある。その場合 sel は昨日のままなので、
// 「今日」を見ていた人が翌朝そのまま入力すると前日の欄に書き込んでしまう。
// 過去日を自分で選んで見ている人まで今日へ引き戻さないよう、直前の「今日」と一致する場合だけ送る。
function syncToday(){
  var today = fmt(new Date());
  if (today === lastToday) return;
  if (sel === lastToday) sel = today;
  render();
}
// 4秒の待ちの途中で閉じられると、その回は送られない。次に開けば全履歴で追いつくが、
// 「その日のうちにPCへ届く」確率を上げるため、隠れる直前に保留分を流す
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "hidden" && syncTimer) syncPush();
});
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible") syncToday();
});
// 復帰した瞬間に引き直す。interval はバックグラウンドで止まる/間引かれるので、
// これが無いと最初の tick が来るまで戻る前の数字が残って見える
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible") timerPaint();
});
window.addEventListener("focus", syncToday);

/* ================= イベント ================= */
document.addEventListener("click", function(ev){
  var t = ev.target;

  var nav = t.closest("[data-nav]");
  if (nav) { tab = nav.dataset.nav; render(); return; }

  var dn = t.closest("[data-dn]");
  if (dn && !dn.disabled) {
    var today = fmt(new Date());
    var minD = fmt(addDays(parseD(today), -7));
    // 明日まで進める。就寝時刻と前日の行動は夜のうちに確定しているので、
    // 翌朝まで抱えて思い出すより、その場で入れた方が記録が正確になる
    var maxD = fmt(addDays(parseD(today), 1));
    var nx = fmt(addDays(parseD(sel), +dn.dataset.dn));
    if (nx >= minD && nx <= maxD) { sel = nx; render(); }
    return;
  }

  // data-f は select(分の実値)も持つが data-v を持たない。ここで拾うとタップだけで値が入る
  var sb = t.closest("[data-f][data-v]");
  if (sb) {
    var f = sb.dataset.f, raw = sb.dataset.v;
    var v = raw==="t" ? true : raw==="f" ? false : parseInt(raw,10);
    var e = Object.assign({}, S.entries[sel] || {});
    if (e[f] === v) { delete e[f]; if (f==="weight") delete e.weightVal; }
    else { e[f] = v; if (f==="weight" && v===false) delete e.weightVal; }
    if (Object.keys(e).length === 0) delete S.entries[sel];
    else S.entries[sel] = e;
    save(); render(); return;
  }

  var td = t.closest("[data-td]");
  if (td) { trendDays = +td.dataset.td; render(); return; }

  var mo = t.closest("[data-mo]");
  if (mo) { monOff = Math.min(0, monOff + (+mo.dataset.mo)); render(); return; }

  var tg = t.closest("[data-tgt]");
  if (tg) {
    var id = tg.dataset.tgt, d = +tg.dataset.d;
    if (S.targets[id] != null) S.targets[id] = Math.min(7, Math.max(0, S.targets[id] + d));
    else S.custom.forEach(function(c){ if (c.id===id) c.target = Math.min(7, Math.max(0, c.target + d)); });
    save(); render(); return;
  }

  var tog = t.closest("[data-tog]");
  if (tog) { S.enabled[tog.dataset.tog] = !(S.enabled[tog.dataset.tog] !== false); save(); render(); return; }

  var del = t.closest("[data-del]");
  if (del) {
    S.custom = S.custom.filter(function(c){ return c.id !== del.dataset.del; });
    save(); render(); return;
  }

  var ac = t.closest("[data-action]");
  if (!ac) return;
  var a = ac.dataset.action;

  if (a === "addcustom") {
    var inp = document.getElementById("newLabel");
    var lab = (inp.value || "").trim();
    if (!lab) return;
    S.custom.push({id: "c_" + Date.now().toString(36), label: lab, target: 5});
    save(); render(); return;
  }
  if (a === "timerStart") {
    // 走行中に別の種別を開始できてしまうと、どちらの経過なのか状態から復元できない。
    // 状態は単一オブジェクトなので、排他はここで閉じる
    if (timerState) { flash("すでに" + timerKind(timerState.kind).label + "を計測中です", true); return; }
    var k = timerKind(ac.dataset.kind);
    timerState = {startedAt: Date.now(), day: fmt(new Date()), kind: k.id};
    persistTimer(); flash(k.label + "タイマー開始", false); render(); return;
  }
  if (a === "timerStop") {
    var mins = timerElapsedMin();
    var tday = timerTarget(timerState.day);
    var kind = timerKind(timerState.kind);
    timerState = null; persistTimer();
    // 止め忘れは「実際より長い」方向にしか壊れない。黙って足すと週の合計が一度で狂い、
    // しかも後から見て異常だと気づけない。記録せず、手入力へ回す
    if (mins > TIMER_MAX_MIN) {
      // 「長すぎる」は評価語。実際に6時間勉強した日にこれを出すと、記録しないうえに
      // 行動そのものを否定することになる。出すのは閾値を超えたという事実と、次の手だけ
      flash(fmtDur(mins) + "（" + fmtDur(TIMER_MAX_MIN) + "超）のため記録していません。記録タブから入力できます", true);
      render(); return;
    }
    if (mins > 0) {
      var te = Object.assign({}, S.entries[tday] || {});
      te[kind.field] = (typeof te[kind.field] === "number" ? te[kind.field] : 0) + mins;
      S.entries[tday] = te;
      save();
    }
    flash(mins > 0 ? fmtDur(mins) + " を記録しました" : "1分未満のため記録していません", false);
    render(); return;
  }
  if (a === "memo") { memoOpen = true; render(); return; }
  if (a === "expcsv" || a === "expjson") {
    var isJson = a === "expjson";
    expText = isJson ? JSON.stringify(S, null, 2) : buildCSV(S);
    // 成功が確定するまでは手動コピーの案内を出しておく(失敗したまま残っても嘘にならない)
    expNote = "コピーできない場合は下を長押しして選択してください";
    render();
    copyText(expText, function(ok){
      if (!ok) return;
      expNote = "コピーしました";
      if (isJson) markBackup();
      render();
    });
    return;
  }
  if (a === "sharejson") { shareBackup(); return; }
  if (a === "showbroken") {
    var bk = ac.dataset.key;
    try { expText = localStorage.getItem(bk) || ""; expNote = "退避データです。長押しでコピーし、下の取り込み欄に貼り付けてください"; }
    catch(e) { console.error("[flourish] 退避データを読めませんでした", e); expText = ""; expNote = "退避データを読めませんでした"; }
    render(); return;
  }
  if (a === "copyreview") {
    revText = buildReviewText(S, fmt(new Date()));
    revNote = "下を長押ししてコピーしてください";
    render();
    copyText(revText, function(ok){ if (ok) { revNote = "コピーしました。Claudeのチャットに貼り付けてください"; render(); } });
    return;
  }
  if (a === "import") {
    var ta = document.getElementById("imp");
    try {
      var parsed = JSON.parse(ta.value);
      if (!isPlainObject(parsed)) throw new Error("最上位がオブジェクトではありません");
      S = migrate(parsed);
      save(); setNote = "取り込み完了(" + Object.keys(S.entries).length + "日分)"; setNoteOk = true;
    } catch(e) {
      console.error("[flourish] 取り込みに失敗しました", e);
      setNote = "取り込み失敗: JSONを確認してください"; setNoteOk = false;
    }
    render(); return;
  }
  if (a === "syncnow") { syncNote = null; syncPush(); return; }
  if (a === "reset1") {
    armed = true; clearTimeout(armTimer);
    armTimer = setTimeout(function(){ armed=false; render(); }, 5000);
    render(); return;
  }
  if (a === "reset2") {
    // 送信先を残したまま消すと、空になった全履歴がそのままPCへ送られて向こうの控えまで巻き添えになる。
    // 「すべてのデータを削除」は同期の設定も含めて消す
    clearTimeout(syncTimer);
    syncCfg = {url:"", token:"", last:null};
    saveSync();
    syncNote = null;
    S = defaultData(); armed = false; save(); render(); return;
  }
});

document.addEventListener("change", function(ev){
  var t = ev.target;
  if (t.id === "wv") {
    var e = Object.assign({}, S.entries[sel] || {});
    // 数字とドットだけ残しても "68.5.2" のような打ち間違いは通る。ドットが2つ残ると
    // Number() が NaN になるので、「数字.数字」として読める先頭部分だけを採る
    var digits = (t.value || "").replace(/[^0-9.]/g, "");
    var val = (digits.match(/^\d*\.?\d*/) || [""])[0];
    if (!/\d/.test(val)) val = "";
    if (val === "") delete e.weightVal; else e.weightVal = val;
    S.entries[sel] = e; save(); render(); return;
  }
  if (t.id === "memo") {
    var me = Object.assign({}, S.entries[sel] || {});
    // 前後の空白だけの入力は「書かなかった」と同じ。値の欠損はキー削除で表す約束に従う
    var txt = (t.value || "").trim();
    if (txt === "") delete me.memo; else me.memo = txt;
    // 全フィールドが空になったら日付キーごと消す(他の入力経路と同じ規約)
    if (Object.keys(me).length === 0) delete S.entries[sel];
    else S.entries[sel] = me;
    save(); render(); return;
  }
  if (t.id === "syncUrl") {
    var u = (t.value || "").trim();
    // 誤った送信先を保存させない。保存できてしまうと、送れない理由が画面から消える
    if (u !== "" && !syncUrlOk(u)) {
      syncNote = {ok:false, msg:"送信先は https://….ts.net の形式のみです"};
      render(); return;
    }
    syncCfg.url = u; saveSync(); syncNote = null; render(); return;
  }
  if (t.id === "syncToken") {
    var tok = (t.value || "").trim();
    // 受信側は32文字未満を拒む。ここで弾かないと「毎回401」を理由不明のまま繰り返す
    if (tok !== "" && tok.length < 32) {
      syncNote = {ok:false, msg:"トークンが短すぎます(32文字以上)。貼り付けが途中で切れていませんか"};
      render(); return;
    }
    syncCfg.token = tok; saveSync(); syncNote = null; render(); return;
  }
  // 分の実値の select。空欄はキー削除で未入力へ戻す(欠損は null を書かずキーごと消す規約)
  var ms = t.closest("select[data-f]");
  if (ms) {
    var mf = ms.dataset.f, me = Object.assign({}, S.entries[sel] || {});
    if (t.value === "") delete me[mf]; else me[mf] = +t.value;
    // 業務時間 0 = その日は仕事をしていない。重さは「なし」で確定するので、もう1タップ求めない。
    // **空欄のときだけ埋める。** 無条件に入れると、本人が「重い」を選んだあとに業務時間を 0 へ
    // 訂正しただけで、入れた値が黙って置き換わる。保存値からは本人の入力かアプリが入れたかを
    // 区別できず、台帳にもそのまま出る(study→studyMin で変換を拒否したのと同じ理由)
    if (mf === "workMin" && me.workMin === 0 && me.workLoad == null) me.workLoad = LOAD_OPTS.indexOf("なし");
    if (Object.keys(me).length === 0) delete S.entries[sel];
    else S.entries[sel] = me;
    save(); render(); return;
  }
  var mn = t.closest("[data-mon]");
  if (mn) { monItem = t.value; render(); return; }
  var th = t.closest("[data-th]");
  if (th) { S.th[th.dataset.th] = +t.value; save(); render(); return; }
});

/* テストフック */
window.__flourish = {
  getS: function(){ return S; },
  setS: function(v){ S = v; },
  save: save, render: render,
  achieved: achieved, phi: phi, strength: strength, buildCSV: buildCSV, weekStats: weekStats,
  defaultData: defaultData, migrate: migrate, fmt: fmt, weekStart: weekStart,
  buildReviewText: buildReviewText, KEY: KEY, syncToday: syncToday,
  brokenKeys: brokenKeys, BROKEN_PREFIX: BROKEN_PREFIX,
  SYNC_KEY: SYNC_KEY, getSync: function(){ return syncCfg; },
  syncPush: syncPush, scheduleSync: scheduleSync, syncUrlOk: syncUrlOk,
  // 項目一覧と段階の刻みはここが真実の出所。テスト側で書き写すと、増やしたときに書き写しだけが腐る
  CORE: CORE, PERDAY: PERDAY, STEPS_N: STEPS_N, fmtSteps: fmtSteps, MOOD: MOOD, MOOD_OPTS: MOOD_OPTS,
  COMPANION_OPTS: COMPANION_OPTS,
  BEDTIME_MIN: BEDTIME_MIN, WAKE_MIN: WAKE_MIN, YT_MIN: YT_MIN, WATER_ML: WATER_ML,
  WORK_MIN: WORK_MIN, LOAD_OPTS: LOAD_OPTS,
  STUDY_MIN: STUDY_MIN, studyDone: studyDone,
  MEDITATION_MIN: MEDITATION_MIN, NAP_MIN: NAP_MIN,
  TIMER_KEY: TIMER_KEY, TIMER_MAX_MIN: TIMER_MAX_MIN,
  getTimer: function(){ return timerState; },
  fmtClock: fmtClock, timerPaint: timerPaint,
  timerTicking: function(){ return timerTick !== null; },
  fmtHM: fmtHM, fmtDur: fmtDur, fmtMl: fmtMl,
};

render();

// オフラインでも起動できるようにする。CSP に worker-src 'self' が無いと登録が弾かれる。
// 登録できなくてもアプリ自体は動く(オンライン時の挙動は Service Worker の有無で変わらない)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function(e){
    console.error("[flourish] Service Worker を登録できませんでした", e);
  });
}
</script>
</body>
</html>
